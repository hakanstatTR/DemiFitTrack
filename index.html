<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DemiFit" />
  <title>DemiFit</title>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <p class="brand splash-brand">DemiFit</p>
      <p class="splash-sub">Train. Fuel. Track.</p>
      <button id="enterBtn" class="btn primary">Tap to start</button>
      <p class="splash-hint">Opens with a short sporty intro sound</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="top">
      <h1 class="brand">DemiFit</h1>
      <p id="topSub" class="sub">Log workouts and meals</p>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="nav">
      <button data-tab="log" class="nav-btn active">Log</button>
      <button data-tab="meals" class="nav-btn">Meals</button>
      <button data-tab="history" class="nav-btn">History</button>
      <button data-tab="progress" class="nav-btn">Progress</button>
    </nav>
  </div>

  <audio id="startupAudio" src="assets/startup_fanfare.wav" preload="auto"></audio>
  <script src="app.js?v=4"></script>
</body>
</html>
